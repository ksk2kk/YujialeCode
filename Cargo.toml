[package]
name = "yjlcoder"
version = "0.1.0"
edition = "2021"
description = "YJLcoder — 极简纯 Rust 本地模型 CLI Agent（低系统提示词 / TUI / QQ / 上下文压缩）"
license = "GPL-3.0-only"
[dependencies]
arboard = { version = "3", features = ["wayland-data-control"] }
base64 = "0.22.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["tls", "gzip"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "stream"] }
tokio = { version = "1", features = ["rt", "time", "macros"] }
tungstenite = "0.24"
libc = "0.2"
unicode-width = "0.2"
[profile.release]
lto = true
strip = true
