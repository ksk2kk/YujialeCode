[package]
name = "yjl-bridge"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "YJLcoder bridge — runs the YJLcoder agent behind the Grok Build TUI over in-process ACP"

[dependencies]
agent-client-protocol = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
xai-acp-lib = { workspace = true }
# 插件市场兼容：复用 grok 的安装/卸载编排与线型
xai-grok-agent = { workspace = true }
xai-grok-shell = { workspace = true }
xai-hooks-plugins-types = { workspace = true }
yjlcoder = { path = "../../../../.." }

[dev-dependencies]
serial_test = { workspace = true }
